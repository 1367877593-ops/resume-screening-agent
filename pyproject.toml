[project]
name = "resume-screening-agent"
version = "0.1.0"
description = "智能简历解析与试题生成引擎"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "pypdf>=4", "python-docx>=1.1"]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src 放业务包，"." 让 config/ 可被 import
pythonpath = ["src", "."]
testpaths = ["tests"]
